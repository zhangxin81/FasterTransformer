<!DOCTYPE html>
<html lang="zh">

<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bilibili-parse</title>
  <link rel="shortcut icon" href="favicon.png">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
<article class="markdown-body">
  <div id="content"></div>
</article>

<script src="./public/lib-loader.js"></script>
<script>
  load_lib(urls({
    name: 'github-markdown-css',
    ver: '5.1.0',
    filename: 'github-markdown.min.css'
  }))

  load_lib(urls({
    name: 'marked',
    ver: '4.0.16',
    filename: 'marked.min.js',
    key: 'marked'
  })).then(marked => {
    fetch('./public/README.md').then(res => {
      if (res.ok) {
        res.text().then(text => {
          document.getElementById('content').innerHTML = marked.parse(text)
        })
      }
    })
  })
</script>
</body>

</html>
